<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>PromptSpace – AI Image Prompt Library &amp; Gallery</title>
<style>
:root{--bg:#131314;--side:#1e1f20;--card:#1b1c1d;--line:#2d2f31;--ink:#e3e3e3;--mute:#9aa0a6;--pill:#004a77;--pill-ink:#c2e7ff;--acc:#a8c7fa;--ok:#1e8e3e;--w:290px;
--f:"Google Sans","Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f);line-height:1.5;overflow-x:hidden;font-size:clamp(.9rem,.86rem + .2vw,1rem)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.ic{width:42px;height:42px;display:inline-grid;place-items:center;border:0;border-radius:50%;background:none;font-size:1.2rem;flex:none;transition:background .15s}
.ic:hover{background:#ffffff14}

/* Sidebar */
.side{position:fixed;z-index:50;inset:0 auto 0 0;width:var(--w);background:var(--side);display:flex;flex-direction:column;transition:transform .25s ease;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sh{display:flex;align-items:center;justify-content:space-between;padding:.75rem .75rem .5rem 1rem}
.brand{display:flex;align-items:center;gap:.6rem;text-decoration:none;color:inherit;min-width:0}
#brand-logo{width:34px;height:34px;object-fit:contain;flex:none}
.logo{font-weight:700;font-size:1.3rem;letter-spacing:-.02em;background:linear-gradient(90deg,#5ac8fa,#8e7cf7,#e45cc8);-webkit-background-clip:text;background-clip:text;color:transparent}
.menu{display:grid;gap:.15rem;padding:.25rem .6rem .6rem}
.item{display:flex;align-items:center;gap:.75rem;width:100%;min-height:44px;padding:.5rem .85rem;border:0;border-radius:999px;background:none;text-align:left;transition:background .15s,box-shadow .2s}
.item:hover{background:#ffffff12;box-shadow:0 0 14px rgba(168,199,250,.22)}
.item[aria-current="true"]{background:var(--pill);color:var(--pill-ink);box-shadow:0 0 16px rgba(0,120,190,.35)}
.item .e{width:1.4rem;text-align:center;flex:none}
.item .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .t small{color:var(--mute);margin-left:.4rem;font-size:.78rem}
.item[aria-current="true"] .t small{color:var(--pill-ink);opacity:.75}
.item .n{margin-left:auto;font-size:.75rem;color:var(--mute)}
.newbtn{background:#2d2f31;font-weight:500}
.nav{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:0 .6rem 1.5rem;scroll-behavior:smooth;scrollbar-width:thin;scrollbar-color:#444 transparent;border-top:1px solid var(--line)}
.nav h2{font-size:.82rem;font-weight:500;color:var(--mute);padding:1.1rem .85rem .4rem}
.scrim{display:none}

/* Main */
.main{margin-left:var(--w);min-height:100%;transition:margin .25s ease;min-width:0}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:.5rem;padding:.7rem clamp(.75rem,3vw,2rem);padding-top:calc(.7rem + env(safe-area-inset-top,0px));background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px)}
.open-btn{display:none}
.search{position:relative;flex:1;max-width:620px;margin:0 auto}
.search input{width:100%;height:46px;border-radius:999px;border:1px solid var(--line);background:var(--side);padding:0 1rem 0 2.8rem}
.search span{position:absolute;left:1rem;top:50%;transform:translateY(-50%);pointer-events:none}
.wrap{padding:.5rem clamp(.9rem,3vw,2.5rem) 3rem;max-width:1800px;margin:0 auto}
h1{font-size:clamp(1.6rem,1rem + 3vw,3rem);line-height:1.1;font-weight:500;letter-spacing:-.02em;background:linear-gradient(90deg,#5ac8fa,#8e7cf7,#e45cc8);-webkit-background-clip:text;background-clip:text;color:transparent;width:fit-content;max-width:100%;padding-bottom:.1em}
.sub{color:var(--mute);margin:.5rem 0 1.25rem;max-width:62ch}
.cur{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem;margin-bottom:1.1rem;color:var(--mute);font-size:.9rem}
.chip{border:1px solid var(--line);background:none;border-radius:999px;padding:.3rem .8rem;min-height:34px;font-size:.85rem}
.chip[aria-pressed="true"]{background:var(--pill);color:var(--pill-ink);border-color:transparent}

/* Cards: thumbnail placeholder. Put <img src="..."> inside .thumb (or add img:"file.jpg" to the data) to replace it; the 4:3 box stays. */
.grid{display:grid;gap:clamp(.9rem,2vw,1.4rem);grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.card{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;transition:box-shadow .2s,border-color .2s}
.card:hover{border-color:#4a4d50;box-shadow:0 0 24px rgba(168,199,250,.12)}
.thumb{position:relative;aspect-ratio:4/3;overflow:hidden;background:linear-gradient(135deg,hsl(var(--h) 80% 48%),hsl(calc(var(--h) + 60) 85% 28%))}
.thumb::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 78% 18%,rgba(255,255,255,.45),transparent 45%),radial-gradient(rgba(255,255,255,.18) 1.5px,transparent 1.5px) 0 0/16px 16px}
.thumb::after{content:attr(data-e);position:absolute;right:1rem;bottom:.6rem;font-size:clamp(3rem,9vw,4.6rem);filter:drop-shadow(0 6px 12px rgba(0,0,0,.35))}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
.thumb:has(img)::before,.thumb:has(img)::after{display:none}
.glass{position:absolute;z-index:2;left:.8rem;bottom:.8rem;right:30%;padding:.4rem .7rem;border-radius:12px;background:rgba(255,255,255,.16);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.25);font-size:.78rem;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cb{position:absolute;z-index:3;left:.8rem;top:.8rem;border:0;border-radius:999px;padding:.25rem .7rem;min-height:30px;background:rgba(0,0,0,.55);color:#fff;font-weight:500;font-size:.82rem;backdrop-filter:blur(6px)}
.body{display:flex;flex-direction:column;gap:.7rem;padding:1rem 1.1rem 1.1rem;flex:1}
.body h3{font-size:1.05rem;font-weight:500;line-height:1.3}
.pr{background:#131314;border:1px solid var(--line);border-radius:12px;padding:.7rem .85rem;color:var(--mute);font-size:.85rem;max-height:9rem;overflow:auto;overflow-wrap:anywhere}
.eng{display:flex;flex-wrap:wrap;gap:.4rem}
.eng button{border:1px solid var(--line);background:none;border-radius:8px;padding:.15rem .55rem;min-height:28px;font-size:.78rem;color:var(--acc)}
.eng button:hover{background:#ffffff10}
.copy{margin-top:auto;min-height:46px;border:0;border-radius:999px;background:var(--acc);color:#062e6f;font-weight:600;transition:background .2s,transform .1s}
.copy:active{transform:scale(.98)}
.copy.done{background:var(--ok);color:#fff}
.empty{grid-column:1/-1;text-align:center;color:var(--mute);padding:3rem 1rem}
.empty button{margin-top:1rem;border:1px solid var(--line);background:none;border-radius:999px;padding:.6rem 1.2rem;min-height:44px}

/* Dialog */
dialog{margin:auto;border:1px solid var(--line);border-radius:24px;background:var(--side);color:var(--ink);width:min(92vw,520px);padding:1.4rem}
dialog::backdrop{background:rgba(0,0,0,.65)}
dialog h2{font-size:1.25rem;font-weight:500;margin-bottom:.3rem}
dialog p{color:var(--mute);font-size:.9rem;margin-bottom:1rem}
dialog textarea,dialog select{width:100%;background:#131314;border:1px solid var(--line);border-radius:12px;padding:.7rem;margin-bottom:.75rem}
dialog textarea{min-height:90px;resize:vertical}
.row{display:flex;gap:.6rem;flex-wrap:wrap;justify-content:flex-end}
.row button{min-height:44px;padding:0 1.2rem;border-radius:999px;border:1px solid var(--line);background:none}
.row .go{background:var(--acc);color:#062e6f;border:0;font-weight:600}
#out{display:none;margin-top:.9rem}

/* Responsive */
@media (min-width:901px){body.hide .side{transform:translateX(-100%)}body.hide .main{margin-left:0}body.hide .open-btn{display:inline-grid}}
@media (max-width:900px){
  .main{margin-left:0}.open-btn{display:inline-grid}
  .side{transform:translateX(-102%);width:min(86vw,320px);box-shadow:0 0 40px rgba(0,0,0,.6)}
  body.show .side{transform:none}
  .scrim{display:block;position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .25s}
  body.show .scrim{opacity:1;pointer-events:auto}
  body.show{overflow:hidden}
}
@media (min-width:1700px){.grid{grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

{c:"anime",t:"Rooftop under a starry sky",e:["Midjourney","Gemini"],x:"Anime key visual of a schoolgirl on a city rooftop at dusk, wind moving her hair and scarf, huge pastel sunset sky with scattered stars, soft cel shading, detailed clouds, modern Japanese animated film style, nostalgic mood --niji 6"},
{c:"3d-render",t:"Pixar-style fox explorer",e:["DALL-E","Gemini","Midjourney"],x:"3D animated movie still of a cute fox explorer with big expressive eyes, tiny backpack and goggles, standing in a glowing forest, soft subsurface scattering fur, warm cinematic lighting, Pixar style, octane render, 4K"},

const $=s=>document.querySelector(s),B=document.body;
const S={c:"all",q:"",e:""};
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const cnt=id=>P.filter(p=>p.c===id).length;

function nav(){
  $("#total").textContent=P.length;
  document.querySelector('.menu [data-c="all"]').setAttribute("aria-current",S.c==="all");
  $("#nav").innerHTML=GROUPS.map(g=>`<h2>${g[0]}</h2>`+g[2].map(c=>`<button class="item" data-c="${c.id}" aria-current="${S.c===c.id}"><span class="e">${c.e}</span><span class="t">/${c.id}<small>${esc(c.d)}</small></span><span class="n">${cnt(c.id)||""}</span></button>`).join("")).join("");
}
function match(p){
  if(S.c!=="all"&&p.c!==S.c)return false;
  if(S.e&&!p.e.includes(S.e))return false;
  const q=S.q.trim().toLowerCase();
  return !q||[p.t,p.x,p.c,CATS[p.c].d,p.e.join(" ")].join(" ").toLowerCase().includes(q);
}
function cur(){
  $("#cur").innerHTML=(S.c==="all"?"Showing all styles":`Showing <b>/${S.c}</b> – ${esc(CATS[S.c].d)}`)+"&nbsp;&nbsp;"+["Gemini","Midjourney","DALL-E"].map(e=>`<button class="chip" data-e="${e}" aria-pressed="${S.e===e}">${e}</button>`).join("");
}
function grid(){
  const l=P.map((p,i)=>[p,i]).filter(([p])=>match(p));
  $("#grid").innerHTML=l.length?l.map(([p,i])=>{const c=CATS[p.c];
    return `<article class="card"><div class="thumb" style="--h:${c.h}" data-e="${c.e}">${p.img?`<img src="${esc(p.img)}" alt="${esc(p.t)}" loading="lazy">`:""}<button class="cb" data-c="${p.c}">/${p.c}</button><div class="glass">${esc(c.d)}</div></div>
    <div class="body"><h3>${esc(p.t)}</h3><div class="pr">${esc(p.x)}</div>
    <div class="eng">${p.e.map(e=>`<button data-e="${e}">${e}</button>`).join("")}</div>
    <button class="copy" data-copy="${i}">📋 Copy Prompt</button></div></article>`}).join("")
  :`<div class="empty"><p>${S.q?"No prompts match your search.":"No prompts in this style yet."}</p><button id="req">Request one for this style</button></div>`;
}
const all=()=>{nav();cur();grid()};
const drawer=o=>{B.classList.toggle("show",o)};
const wide=()=>matchMedia("(min-width:901px)").matches;

document.addEventListener("click",async ev=>{
  const b=ev.target.closest("button,a.brand");if(!b)return;if(b.tagName==="A")ev.preventDefault();
  if(b.dataset.c){S.c=b.dataset.c;drawer(false);all();scrollTo({top:0,behavior:"smooth"})}
  else if(b.dataset.e){S.e=S.e===b.dataset.e?"":b.dataset.e;cur();grid()}
  else if(b.dataset.copy!==undefined){
    const t=P[b.dataset.copy].x;await copy(t);
    b.textContent="✅ Copied!";b.classList.add("done");
    setTimeout(()=>{b.textContent="📋 Copy Prompt";b.classList.remove("done")},1800);
  }else if(b.id==="req")openDlg();
});
async function copy(t){
  try{await navigator.clipboard.writeText(t)}catch{
    const a=document.createElement("textarea");a.value=t;a.style.cssText="position:fixed;opacity:0";
    document.body.appendChild(a);a.select();try{document.execCommand("copy")}catch{}a.remove();
  }
}
$("#close").onclick=()=>wide()?B.classList.add("hide"):drawer(false);
$("#open").onclick=()=>wide()?B.classList.remove("hide"):drawer(true);
$("#scrim").onclick=()=>drawer(false);
addEventListener("keydown",e=>{if(e.key==="Escape")drawer(false)});
$("#q").addEventListener("input",e=>{S.q=e.target.value;grid()});
$("#find").onclick=()=>{drawer(false);scrollTo({top:0,behavior:"smooth"});setTimeout(()=>$("#q").focus(),150)};

function openDlg(){
  $("#sty").innerHTML=Object.values(CATS).map(c=>`<option value="${c.id}"${c.id===S.c?" selected":""}>${c.e} /${c.id} – ${esc(c.d)}</option>`).join("");
  $("#out").style.display="none";drawer(false);$("#dlg").showModal();
}
$("#new").onclick=openDlg;
$("#cancel").onclick=()=>$("#dlg").close();
$("#make").onclick=async()=>{
  const idea=$("#idea").value.trim()||"[your subject]",c=CATS[$("#sty").value];
  const t=`${idea}, ${c.d.toLowerCase()} style, [mood and color palette], [lighting], [camera angle or composition], highly detailed, professional quality`;
  $("#res").value=t;$("#out").style.display="block";await copy(t);
  $("#make").textContent="✅ Copied!";setTimeout(()=>$("#make").textContent="Build prompt",1800);
};
all();
</script>
</body>
</html>
